<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Herald">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f7cff"/>
      <stop offset="100%" stop-color="#7b5cff"/>
    </linearGradient>
  </defs>

  <!-- rounded plate -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#g)"/>

  <!-- stylised call sign: three arcs radiating from a dot, inside an H -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M40 92 V36" stroke-width="9"/>
    <path d="M88 92 V36" stroke-width="9"/>
    <path d="M40 64 H88" stroke-width="9"/>
  </g>

  <!-- signal dot -->
  <circle cx="64" cy="64" r="6.5" fill="#ffffff"/>

  <!-- outward signal -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-linecap="round">
    <path d="M78 50 a20 20 0 0 1 0 28" stroke-width="4.5"/>
    <path d="M86 42 a32 32 0 0 1 0 44" stroke-width="3.5" stroke-opacity="0.6"/>
  </g>
</svg>
